# coturn 配置（与 server/lib/rtc.js 的 HMAC 临时凭证配套）
# 安装：sudo apt install coturn；编辑 /etc/default/coturn 里 TURNSERVER_ENABLED=1
# 注意：TURN 的 UDP 3478 不能走 Cloudflare Tunnel，需 A 记录直连 + 安全组放行。

listening-port=3478
# 云服务器（如华为云 / 阿里云 ECS）：网卡为内网 IP、公网 IP 走 NAT，需显式声明 external-ip
# 格式：external-ip=<公网IP>/<内网IP>；此处为示例值，请替换为你自己的
listening-ip=10.0.0.10
external-ip=203.0.113.10/10.0.0.10
# TLS 监听可按需放开（证书路径自行替换）
# tls-listening-port=5349

# 中继端口范围
min-port=49152
max-port=49200

# 使用长期凭证 + 临时凭证（rest-api 可选）
use-auth-secret
static-auth-secret=__CHANGE_ME_TURN_SECRET__

realm=example.com
fingerprint
lt-cred-mech

# 默认拒绝未知来源，生产可改为具体公网 IP
no-cli
no-loopback-peers
no-multicast-peers
stale-nonce=600

# 日志
verbose
